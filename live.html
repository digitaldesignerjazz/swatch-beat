<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swatch .beat • Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&amp;display=swap');
        
        body {
            font-family: 'Space Grotesk', system_ui, -apple-system, sans-serif;
        }
        
        .beat-display {
            font-size: 7.5rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.08em;
            font-feature-settings: "tnum";
        }
        
        .section {
            background: #111827;
            border: 1px solid #374151;
        }
    </style>
</head>
<body class="bg-black text-white">
    <div class="max-w-2xl mx-auto px-6 pt-12 pb-16">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="flex items-center justify-center gap-x-2 mb-2">
                <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                <span class="text-emerald-400 text-sm font-semibold tracking-[3px]">LIVE</span>
            </div>
            <h1 class="text-3xl font-semibold tracking-tight">Swatch .beat</h1>
        </div>

        <!-- Main Live Display -->
        <div class="text-center mb-12">
            <div class="text-xs tracking-[2px] text-slate-400 mb-1">CURRENT .BEAT</div>
            <div id="beat" class="beat-display text-emerald-400 tabular-nums">@000.000</div>
            
            <div id="utc" class="text-2xl font-mono text-slate-300 mt-3 tracking-[1px]">
                00:00:00.000 UTC
            </div>
            
            <div id="date" class="text-slate-400 mt-2 text-sm">
                Loading date...
            </div>
        </div>

        <!-- Converter Section -->
        <div class="section rounded-3xl p-8">
            <div class="text-sm font-semibold tracking-wider text-slate-400 mb-6 text-center">
                CONVERTER
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- .beat to UTC -->
                <div>
                    <label class="block text-xs text-slate-400 mb-2">.BEAT → UTC</label>
                    <div class="flex gap-2">
                        <input id="beat-input" type="number" step="0.001" value="500" 
                               class="flex-1 bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-center font-mono">
                        <button onclick="convertBeatToUtc()"
                                class="px-5 bg-emerald-600 hover:bg-emerald-500 rounded-2xl text-sm font-medium">
                            Convert
                        </button>
                    </div>
                    <div id="beat-to-utc-result" class="mt-2 text-emerald-400 font-mono text-sm h-5"></div>
                </div>

                <!-- UTC to .beat -->
                <div>
                    <label class="block text-xs text-slate-400 mb-2">UTC → .BEAT</label>
                    <div class="flex gap-2">
                        <input id="utc-hour" type="number" value="12" class="w-16 bg-slate-900 border border-slate-700 rounded-2xl px-3 py-3 text-center font-mono">
                        <input id="utc-minute" type="number" value="0" class="w-16 bg-slate-900 border border-slate-700 rounded-2xl px-3 py-3 text-center font-mono">
                        <input id="utc-second" type="number" value="0" class="w-16 bg-slate-900 border border-slate-700 rounded-2xl px-3 py-3 text-center font-mono">
                        <button onclick="convertUtcToBeat()"
                                class="px-5 bg-emerald-600 hover:bg-emerald-500 rounded-2xl text-sm font-medium">
                            Convert
                        </button>
                    </div>
                    <div id="utc-to-beat-result" class="mt-2 text-emerald-400 font-mono text-sm h-5"></div>
                </div>

            </div>
        </div>

        <div class="text-center text-xs text-slate-500 mt-8">
            One .beat = 86.4 seconds &nbsp;•&nbsp; Updates every 16ms
        </div>

    </div>

    <script src="beat_converter.js"></script>
    <script>
        function updateLiveDisplay() {
            const now = new Date();
            
            // Calculate precise .beat
            const totalSeconds = 
                (now.getUTCHours() * 3600) + 
                (now.getUTCMinutes() * 60) + 
                now.getUTCSeconds() + 
                (now.getUTCMilliseconds() / 1000);
            
            const beat = totalSeconds / 86.4;
            
            // Update .beat display
            document.getElementById('beat').textContent = 
                '@' + beat.toFixed(3).padStart(7, '0');
            
            // Update UTC with milliseconds
            const utcTime = 
                now.getUTCHours().toString().padStart(2, '0') + ':' +
                now.getUTCMinutes().toString().padStart(2, '0') + ':' +
                now.getUTCSeconds().toString().padStart(2, '0') + '.' +
                now.getUTCMilliseconds().toString().padStart(3, '0');
            
            document.getElementById('utc').textContent = utcTime + ' UTC';
            
            // Update date
            const dateStr = now.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.getElementById('date').textContent = dateStr;
        }

        function convertBeatToUtc() {
            const beatInput = parseFloat(document.getElementById('beat-input').value);
            if (isNaN(beatInput)) return;
            
            const { hours, minutes, seconds } = beatToUtc(beatInput);
            const resultEl = document.getElementById('beat-to-utc-result');
            resultEl.textContent = 
                `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')} UTC`;
        }

        function convertUtcToBeat() {
            const h = parseInt(document.getElementById('utc-hour').value) || 0;
            const m = parseInt(document.getElementById('utc-minute').value) || 0;
            const s = parseInt(document.getElementById('utc-second').value) || 0;
            
            const beat = utcToBeat(h, m, s);
            document.getElementById('utc-to-beat-result').textContent = 
                '@' + beat.toFixed(3);
        }

        // Update every 16ms
        setInterval(updateLiveDisplay, 16);
        updateLiveDisplay();

        // Auto convert on input
        ['beat-input'].forEach(id => {
            document.getElementById(id).addEventListener('input', convertBeatToUtc);
        });
        
        ['utc-hour', 'utc-minute', 'utc-second'].forEach(id => {
            document.getElementById(id).addEventListener('input', convertUtcToBeat);
        });

        // Initial conversions
        setTimeout(() => {
            convertBeatToUtc();
            convertUtcToBeat();
        }, 100);
    </script>
</body>
</html>
